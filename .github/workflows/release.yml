# Tag `vX.Y.Z` → multi-arch image on GHCR (`make pull` with ARTIFACT_IMAGE=ghcr.io/<owner>/artifact-site:X.Y.Z
# then runs it without a local build) and, when cli/package.json carries a version npm does not have yet,
# `@artifact-site/cli` on npm — via npm's trusted publishing (this repository + this workflow file are
# registered as the package's publisher on npmjs.com), so no token is stored here.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: image on GHCR
    needs: skills
    if: ${{ github.event_name == 'push' && !cancelled() && (needs.skills.result == 'success' || github.repository != 'lexmount/artifact-site') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    name: "@artifact-site/cli on npm"
    # Tags are pushed in the public repository; a matching tag here must not attempt a publish.
    if: github.event_name == 'push' && github.repository == 'lexmount/artifact-site'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing: npm verifies the OIDC token from this workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11 # trusted publishing needs npm 11.5+; stay on the tested major
      - run: npm --prefix cli ci
      - run: npm --prefix cli test
      - name: Publish, unless this version is already on npm (prereleases go to the `next` tag)
        run: scripts/publish-cli.sh

  skills:
    name: Complete agent skill distribution
    needs: npm
    if: github.event_name == 'push' && github.repository == 'lexmount/artifact-site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build-skill-package.mjs --check --distribution-only --release "$GITHUB_REF_NAME"
      - name: Publish immutable skill files and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-skill.sh

  distribution:
    name: Publish CLI and skills without a server image
    if: github.event_name == 'workflow_dispatch' && github.repository == 'lexmount/artifact-site'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11
      - run: npm --prefix cli ci
      - run: npm --prefix cli test
      - name: Verify and pin the CLI release tag
        id: release
        run: bash scripts/prepare-cli-release.sh
      - run: scripts/publish-cli.sh
      - run: node scripts/build-skill-package.mjs --check --distribution-only --release "${{ steps.release.outputs.tag }}"
      - name: Publish immutable skill files and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: bash scripts/publish-skill.sh "$RELEASE_TAG"
