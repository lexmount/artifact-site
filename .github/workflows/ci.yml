name: CI

on:
  push:
    branches: [main, master]  # main: the public repository; master: the private one it is exported from
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The root acceptance suite imports CLI commands and exercises real API handlers.
      - run: npm ci --prefix cli
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:readme
      - run: npm test
      - name: Native archive acceptance
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev libarchive-tools gcc
          npm run build:archive
          ARCHIVE_INTEGRATION=1 npx vitest run test/package-archive.integration.test.ts test/publish-client-recovery.test.ts test/archive-chunks.test.ts

  integration:
    name: postgres integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U t -d t"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run test/db-postgres.integration.test.ts
        env:
          ARTIFACT_DATABASE_URL: postgres://t:t@127.0.0.1:5432/t?sslmode=disable
      - name: Build archive reader for PostgreSQL package acceptance
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev libarchive-tools gcc
          npm run build:archive
      # The administration suite is SQL-heavy (aggregates, window functions, typed parameters):
      # run it against the real store as well, not only the SQLite test backend.
      - run: npm run test:pg:rbac
        env:
          ARCHIVE_INTEGRATION: "1"
          ARTIFACT_DB_DRIVER: postgres
          ARTIFACT_DATABASE_URL: postgres://t:t@127.0.0.1:5432/t?sslmode=disable

  cli:
    name: cli
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && node bin/artifact-site.js --help
      - name: Install the packed CLI on the supported Node version
        run: |
          set -euo pipefail
          package=$(npm pack --silent)
          npm install --global --engine-strict "./$package"
          artifact-site --help

  image:
    name: docker build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-dependencies: true
      - name: Test native navigation, upload guards and downloads
        run: npx vitest run test/preview-navigation.browser.test.ts test/upload-leave-browser.test.ts test/download-browser.test.ts
        env:
          E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: Test static thumbnail sandbox
        run: npx vitest run test/thumbnail-preview.test.ts
        env:
          THUMBNAIL_BROWSER: "1"
          E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - uses: docker/setup-buildx-action@v3
      - name: Test browser account recovery
        run: npx vitest run test/auth-recovery.browser.test.ts
        env:
          E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: artifact-site:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test the runtime image and browser flows
        run: bash scripts/test-image.sh artifact-site:ci
        env:
          E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: artifact-site:subpath
          build-args: ARTIFACT_BASE_PATH=/artifact-site
          cache-from: type=gha
      - name: Build fixed subpath image without build arguments
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.artifact-site
          push: false
          load: true
          tags: artifact-site:fixed-subpath
          cache-from: type=gha
      - name: Test subpath deployment and gateway cutover
        run: node scripts/test-subpath.mjs artifact-site:subpath
        env:
          E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: Test fixed subpath image
        run: node scripts/test-subpath.mjs artifact-site:fixed-subpath
        env:
          E2E_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: image-server-log
          path: test-results/*.log
