# Weekly dependency PRs, grouped so a routine bump is one review, not twenty.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A TypeScript major lands only when eslint-config-next / typescript-eslint accept it:
      # bumped blindly it breaks `npm ci` (peer resolution) and takes the whole dev group with it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Same for eslint: v10 drops the rule-context API eslint-plugin-react (via eslint-config-next)
      # still uses, so `npm run lint` fails until the plugin catches up.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
    groups:
      cli:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
